name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    name: Run Python Backend Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest

      - name: Run Backend Math & Indicator Tests
        run: |
          cd backend
          pytest test_main.py

  deploy-render:
    name: Production Deployment Trigger
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Notify GitHub of Deployment State
        run: |
          echo "GitHub Actions CI checks have successfully passed!"
          echo "By default, Render will automatically catch this git push and execute the Docker container build in real-time."
          echo "If you have disabled 'Auto-Deploy' on Render and prefer to trigger it programmatically via a webhook, configure the RENDER_DEPLOY_HOOK secret in your GitHub repository settings."

      - name: Trigger Render Webhook (Optional)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Explicitly triggering Render deployment webhook..."
            curl -X GET "$RENDER_DEPLOY_HOOK"
          else
            echo "No explicit RENDER_DEPLOY_HOOK secret found. Relying on Render's native GitHub Webhook Auto-Deploy (recommended)."
          fi
